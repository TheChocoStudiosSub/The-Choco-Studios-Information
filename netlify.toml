[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://the-choco-studios-official.vercel.app; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://tcs-choco-ai.vercel.app; upgrade-insecure-requests"

# Retired product pages are preserved in Git history but no longer served as active portfolio entries.
[[redirects]]
  from = "/products/choco-ai.html"
  to = "/"
  status = 301
  force = true

